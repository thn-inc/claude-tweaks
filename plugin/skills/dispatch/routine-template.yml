# Migration note: a Routine created from /claude-tweaks:triage's old template still
# fires "triage dispatch", a skill that no longer exists (grants now live at
# /claude-tweaks:backlog refine). Re-create it via
# `/claude-tweaks:routine create dispatch` (this template) — the old routine keeps
# firing a dead prompt until you replace or delete it at claude.ai/code/routines.
template_version: 11
routine_name: dispatch-weekdays
kickoff: dispatch --budget 1
# Optional: `branch: <name>` pins the assembled kernel's target-branch placeholder.
# Normally unset here — a branch is project-specific, so /claude-tweaks:routine resolves
# it at instantiation.
model: claude-sonnet-5-5
allowed_tools: [Bash, Read, Edit, Write, Grep, Glob, Task]
mcp_connections: []
default_schedule:
  cron_expression: "11 */2 * * 1-5"
  description: "every 2 hours on weekdays, UTC — confirm against your local timezone at creation time. Tightened from a once-daily anchor (was \"0 4 * * 1-5\") for 12x lower queue-drain latency while keeping the same daily-brake role"
notes: >
  Headless queue consumer: pulls the open + auto:build, no bot:*, unclaimed queue, claims
  every member of that group, and hands it to /claude-tweaks:flow for pure execution.
  each firing runs the bare drain with an explicit --budget 1 — exactly one dispatch group
  (one record, or one fast-lane bundle) per firing, chosen by priority-then-age ranking. --budget 1 is stated explicitly
  (rather than inheriting dispatch-batch-size, default 3) to preserve the fleet's
  one-group-per-firing cadence after #1492 retired `dispatch next`; raise it deliberately
  if you want each firing to drain more. The claim ref makes
  overlapping firings harmless — a second firing's queue pull skips anything already
  claimed — and a failed run releases its claim and retries at a later firing, up to the
  dispatch-retry-ceiling policy flag (default 3), after which auto:build is removed,
  bot:blocked is added, and the record stops auto-retrying. Only /claude-tweaks:backlog refine's
  interactive invocation ever grants auto:build/auto:merge a record didn't already have —
  this routine only downgrades or strips a grant it reads (auto:merge or auto:merge-pending
  revoked for a correctness/ambiguous-classified failure, preserved for a transient one, per
  assess-agent-autonomy's failure-check mode; auto:build removed at the retry ceiling); it
  revokes trust, never originates it. One exception: this routine's own Auto-merge gate does
  promote an already-present auto:merge-pending to auto:merge once it matures past the
  grant-veto-window-hours policy key — promotion of a grant the origination opt-in already
  authorized, not origination of a new one. Scheduling this routine alone is not enough to make a
  code-health/harness-health/journey-health/docs-health routine's filed issues progress — a human
  still has to run `/claude-tweaks:backlog refine` periodically to grant auto:build before
  this routine has anything to pick up. A group whose run comes back clean (per the
  two-layer auto-merge gate, assess-agent-autonomy's merge-check mode verdicting auto-merge)
  merges without waiting, when every member carries auto:merge or a matured
  auto:merge-pending; anything less than clean falls back to a normal pending-review wait.
  There is no consolidated multi-group console — each firing reports only its own group's
  outcome; the aggregate picture surfaces over time via /claude-tweaks:tidy's own periodic
  GitHub/PR sweep. A pending-review outcome parks (branch and run dir wait for a
  human, or the claim's TTL expires and a later firing supersedes it); a firing with no
  eligible groups is a cheap no-op. Subagent execution requires the Task tool (in
  allowed_tools) and the superpowers plugin in the cloud environment.
