template_version: 10
routine_name: journey-health-daily
kickoff: journey-health --min-confidence high
# Optional: `branch: <name>` pins the assembled kernel's target-branch placeholder.
# Normally unset here — a branch is project-specific, so /claude-tweaks:routine resolves
# it at instantiation.
model: claude-sonnet-5
allowed_tools: [Bash, Read, Grep, Glob]
mcp_connections: []
default_schedule:
  cron_expression: "0 4 * * *"
  description: "off-peak anchor, UTC — confirm against your local timezone at creation time"
notes: >
  Report-only, like code-health and harness-health — no Edit in allowed_tools,
  nothing auto-applies. Light-tier checks only (file-existence, self-review,
  coverage scan); the deep tier is interactive-only (`--deep`) until a
  validation spike confirms cloud-Routine feasibility for a background dev
  server + playwright-cli session. See journey-health/SKILL.md's Step 3.5
  for details. `--min-confidence high` keeps a scheduled firing quiet by
  default (only confidence:high findings file automatically) — see
  journey-health/SKILL.md's Routine Configuration section.
