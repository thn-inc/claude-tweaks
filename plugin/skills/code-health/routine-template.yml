template_version: 10
routine_name: code-health-daily
kickoff: code-health
# Optional: `branch: <name>` pins the assembled kernel's target-branch placeholder.
# Normally unset here — a branch is project-specific, so /claude-tweaks:routine resolves
# it at instantiation.
# Optional: `focus: <vertical>` (e.g. `dead-code`) appends `focus=<vertical>` to this
# template's `kickoff` value when a per-vertical routine is instantiated from this same
# generalist template — live today via /claude-tweaks:routine fleet on (see
# skills/routine/fleet.md's composition-table Vertical finder rows, plus
# skills/_shared/routine-template-schema.md's field table and
# skills/code-health/focus-mode.md). Unset here: this shipped copy stays the
# generalist routine; focus values are supplied at fleet-provisioning time.
model: claude-sonnet-5-5
allowed_tools: [Bash, Read, Grep, Glob]
mcp_connections: []
default_schedule:
  cron_expression: "0 3 * * *"
  description: "off-peak anchor, UTC — confirm against your local timezone at creation time"
notes: >
  Code-health's own next-slice rotation makes a skipped or repeated firing harmless — no
  --area flag is passed, so next-slice always picks the highest-priority slice
  automatically. See skills/code-health/SKILL.md's "Routine Configuration" section for
  the --budget / token-cap tuning guidance this template doesn't need to restate. Filed
  issues are born-ready — each carries risk:<tier>/size:<tier> labels and the ready
  label already applied at filing time, so they land directly in the authorization
  gate's worklist with no manual tiering step; a human still needs to periodically run
  `/claude-tweaks:backlog refine` to actually authorize (grant auto:build/auto:merge)
  those ready findings for autonomous building.
