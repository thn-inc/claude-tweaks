      # Retargeted (#3376): 7.0.0's brainstorming rewrite dropped "Invoke the
      # writing-plans skill"; the surviving terminal-step line is "For software,
      # invoke superpowers:writing-plans and no other skill." CLAUDE.md's
      # override still holds against it.
      - file: "CLAUDE.md"
        claims: "brainstorming's terminal step names writing-plans as the next skill — the step the project override suppresses"
        upstream-path: "skills/brainstorming/SKILL.md"
        must-match: "invoke superpowers:writing-plans and no other skill"
      - file: "plugin/skills/_shared/local-files-preflight-stop.md"
