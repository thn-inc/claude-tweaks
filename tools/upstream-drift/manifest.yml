# tools/upstream-drift/manifest.yml
#
# What this repo claims about each upstream dependency, and how to test those
# claims against the artifact actually installed. Maintainer-only tooling: this
# directory is never shipped payload (it lives outside plugin/), and nothing
# under plugin/bin/ may import from it.
#
# The Impeccable plugin and the Impeccable CLI are TWO INDEPENDENT ENTRIES.
# Conflating them is the documented root cause of the drift that motivated this
# tool: a pin was maintained for one version line while the other was the thing
# actually installed, and no check ever compared either against reality.
#
# Every `installed-probe` resolves a version FROM THE ARTIFACT ITSELF, never
# from install metadata, a catalog, or gitCommitSha ([IL-89]).

dependencies:
  - name: impeccable-cli
    kind: npm-cli
    installed-probe:
      type: command
      run: "npx --no-install impeccable --version"
      root: "npm root -g"
      root-suffix: "impeccable"
    pinned: "3.6.0"
    # This is a shared dev host: other sessions running bare `npx impeccable`
    # (no --no-install, no version pin) periodically refresh npm's local npx
    # cache to whatever is then "latest" on the registry, and `npx --no-install`
    # here resolves against that cache non-deterministically — this drifted
    # exact-pin twice (#1900, then #2277) with no behavioral change between
    # 3.6.0 and 4.1.0 either time. `floor` accepts any installed version >= the
    # pin instead of requiring an exact match; a real behavioral break is still
    # caught by this dependency's own fixtures below, which run regardless.
    version-mode: floor
    upstream:
      repo: "pbakaus/impeccable"
      tag-prefix: "cli-v"
    contract-paths:
      - "cli/engine/cli/main.mjs"
      - "cli/engine/registry/antipatterns.mjs"
    assertions:
      - file: "plugin/skills/design-wrapper/impeccable-cli.md"
        claims: "findings JSON is written to stdout, not stderr"
        upstream-path: "cli/engine/cli/main.mjs"
        must-match: "process.stdout.write(formatFindings"
      - file: "plugin/skills/design-wrapper/impeccable-cli.md"
        claims: "a clean scan prints an empty JSON array rather than nothing"
        upstream-path: "cli/engine/cli/main.mjs"
        must-match: "process.stdout.write('[]"
    fixtures:
      - run: "npx --no-install impeccable detect --json --no-config --no-design-system tests/fixtures/impeccable-cli/warning.html"
        expect:
          exit: 2
          stream: stdout
          keys: [antipattern, name, description, severity, category, file, line, snippet]
      - run: "npx --no-install impeccable detect --json --no-config --no-design-system tests/fixtures/impeccable-cli/clean.html"
        expect:
          exit: 0
          stream: stdout
          keys: []

  - name: impeccable-plugin
    kind: claude-plugin
    installed-probe:
      type: plugin-cache-glob
      glob: "~/.claude/plugins/cache/*/impeccable/*/.claude-plugin/plugin.json"
    pinned: "4.0.2"
    upstream:
      repo: "pbakaus/impeccable"
      tag-prefix: "skill-v"
    contract-paths:
      - "skills/impeccable/SKILL.md"
      - "skills/impeccable/scripts/context-signals.mjs"
      - "skills/impeccable/reference/new-work.md"
      - "agents/impeccable-finish-reviewer.md"
      - "skills/impeccable/reference/document.md"
      - "skills/impeccable/scripts/concept-seed.mjs"
    assertions:
      - file: "plugin/skills/design-wrapper/command-map.md"
        claims: "the plugin exposes a polish command"
        upstream-path: "skills/impeccable/SKILL.md"
        must-match: "polish [target]"
      - file: "plugin/skills/design-wrapper/modes/shape.md"
        claims: "the plugin exposes a shape command taking a topic"
        upstream-path: "skills/impeccable/SKILL.md"
        must-match: "shape [feature]"
      - file: "plugin/skills/design-wrapper/modes/live.md"
        claims: "live mode boots a server and enters a poll loop via scripts/live.mjs"
        upstream-path: "skills/impeccable/scripts/live.mjs"
        must-match: "enter the live variant poll loop"
      - file: "plugin/skills/design-wrapper/impeccable-plugin.md"
        claims: "context-signals.mjs exports gatherSignals(cwd), defaulting to process.cwd()"
        upstream-path: "skills/impeccable/scripts/context-signals.mjs"
        must-match: "export async function gatherSignals(cwd = process.cwd())"
      - file: "plugin/skills/design-wrapper/impeccable-plugin.md"
        claims: "the context-signals CLI entrypoint reads no argv — it passes process.cwd() and nothing else"
        upstream-path: "skills/impeccable/scripts/context-signals.mjs"
        must-match: "const signals = await gatherSignals(process.cwd());"
      - file: "plugin/skills/design-wrapper/impeccable-plugin.md"
        claims: "scan.targets filters on scannability, not frontend-ness — bare .js and .ts are in SCANNABLE_EXT, which is why Layer 3 cannot be retired"
        upstream-path: "skills/impeccable/scripts/context-signals.mjs"
        must-match: "'.jsx', '.tsx', '.js', '.ts', '.vue', '.svelte', '.astro',"
      # The direction contract. _shared/design-contract.md hard-codes the five block
      # labels and nothing else about upstream's contract, so a rename upstream must
      # surface as drift here — otherwise the parse quietly stops matching and /demo
      # renders an empty brief, which is indistinguishable from a record that simply
      # never had a contract.
      - file: "plugin/skills/_shared/design-contract.md"
        claims: "the direction contract lives in the built artifact's opening comment, not in a repo file at a fixed path"
        upstream-path: "skills/impeccable/reference/new-work.md"
        must-match: "as a contract in the artifact's opening comment"
      - file: "plugin/skills/_shared/design-contract.md"
        claims: "the contract's five block labels are exactly THESIS, OWN-WORLD, STORY, FIRST VIEWPORT, FORM"
        upstream-path: "agents/impeccable-finish-reviewer.md"
        must-match: "(THESIS, OWN-WORLD, STORY, FIRST VIEWPORT, FORM)"
      - file: "plugin/skills/_shared/design-contract.md"
        claims: "the FORM block carries the seed key, and only when the seed dealt stagings — so its absence is normal, not drift"
        upstream-path: "skills/impeccable/reference/new-work.md"
        must-match: "the seed key the script printed"
      - file: "plugin/skills/design-wrapper/modes/explore.md"
        claims: "the seed path reuses a completed workshop choice without re-asking"
        upstream-path: "skills/impeccable/reference/document.md"
        must-match: "use its chosen direction directly"
      - file: "plugin/skills/design-wrapper/modes/explore.md"
        claims: "reroll excludes already-shown directions"
        upstream-path: "skills/impeccable/reference/new-work.md"
        must-match: "Re-roll eliminates every direction already shown"
      - file: "plugin/skills/design-wrapper/modes/explore.md"
        claims: "the direction-scope invocation exists"
        upstream-path: "skills/impeccable/scripts/concept-seed.mjs"
        must-match: "--scope direction"
      - file: "plugin/skills/design-wrapper/modes/explore.md"
        claims: "after two consecutive rerolls, upstream asks what quality is missing"
        upstream-path: "skills/impeccable/reference/new-work.md"
        must-match: "after two consecutive re-rolls, ask what quality is missing"
      - file: "plugin/skills/design-wrapper/modes/explore.md"
        claims: "the canon standing exit is the user's door, never the mode's — listed last, never recommended"
        upstream-path: "skills/impeccable/reference/new-work.md"
        must-match: "It is the user's door, never yours"
      - file: "plugin/skills/design-wrapper/modes/explore.md"
        claims: "the surface-scope invocation exists"
        upstream-path: "skills/impeccable/scripts/concept-seed.mjs"
        must-match: "--scope surface"
    fixtures: []

  # superpowers: the repo's heaviest dependency — eight consumed skills, and
  # /build's controller rides SDD's documented loop. Assertions pin the upstream
  # literals claude-tweaks acts on; the full pin/inert classification of every
  # citing file (the sweep ledger) is a comment on #262.
  # Rejected assertion candidate: specify/decomposition-mode.md's 3-8
  # tasks-per-work-unit sizing — no upstream literal encodes a task count
  # (writing-plans' granularity vocabulary is per-step: "bite-sized",
  # "2-5 minutes"); the sizing is local convention, its skill references bare
  # invocations — but the file itself is pinned separately, via assertion 13
  # (its own, unrelated git rm/add commands).
  - name: superpowers
    kind: claude-plugin
    installed-probe:
      type: plugin-cache-glob
      glob: "~/.claude/plugins/cache/*/superpowers/*/.claude-plugin/plugin.json"
    pinned: "6.2.0"
    upstream:
      repo: "obra/superpowers"
      tag-prefix: "v"
    contract-paths:
      - "skills/subagent-driven-development/SKILL.md"
      - "skills/subagent-driven-development/implementer-prompt.md"
      - "skills/brainstorming/SKILL.md"
      - "skills/using-git-worktrees/SKILL.md"
      - "skills/finishing-a-development-branch/SKILL.md"
      - "skills/writing-plans/SKILL.md"
    assertions:
      - file: "plugin/skills/_shared/subagent-output-contract.md"
        claims: "the four-status vocabulary mirrors SDD's implementer statuses"
        upstream-path: "skills/subagent-driven-development/implementer-prompt.md"
        must-match: "DONE | DONE_WITH_CONCERNS | BLOCKED | NEEDS_CONTEXT"
      - file: "plugin/skills/build/SKILL.md"
        claims: "SDD ends by invoking finishing-a-development-branch — the step /build suppresses"
        upstream-path: "skills/subagent-driven-development/SKILL.md"
        must-match: "Use superpowers:finishing-a-development-branch"
      - file: "plugin/skills/build/SKILL.md"
        claims: "SDD has a per-task model-selection heuristic the effort-tier override overrides"
        upstream-path: "skills/subagent-driven-development/SKILL.md"
        must-match: "## Model Selection"
      - file: "CLAUDE.md"
        claims: "brainstorming's terminal step invokes writing-plans — the step the project override suppresses"
        upstream-path: "skills/brainstorming/SKILL.md"
        must-match: "Invoke the writing-plans skill"
      - file: "plugin/skills/_shared/local-files-preflight-stop.md"
        claims: "the SDD workspace lives at .superpowers/sdd/ — also cited as the SDD ledger by wrap-up's summary template"
        upstream-path: "skills/subagent-driven-development/scripts/sdd-workspace"
        must-match: 'base="$root/.superpowers/sdd"'
      - file: "plugin/skills/build/failure-recovery.md"
        claims: "SDD handles failed tasks with its own re-dispatch/escalation ladder — the recovery table defers to it before main-thread fallback"
        upstream-path: "skills/subagent-driven-development/SKILL.md"
        must-match: "provide more context and re-dispatch with the same model"
      - file: "plugin/bin/lib/hooks/worktree-detect.js"
        claims: "ports using-git-worktrees' Step 0 GIT_DIR != GIT_COMMON + submodule-guard heuristic, so the hook and the skill never disagree about what counts as an isolated worktree"
        upstream-path: "skills/using-git-worktrees/SKILL.md"
        must-match: "**If `GIT_DIR != GIT_COMMON` (and not a submodule):**"
      - file: "plugin/skills/build/dispatch.md"
        claims: "SDD's final whole-branch review is a named step — the dispatch /build instructs to review the diff and focused tests only, never the full suite (#1921)"
        upstream-path: "skills/subagent-driven-development/SKILL.md"
        must-match: "## Final Review"
      - file: "plugin/skills/_shared/scratch-worktree.md"
        claims: "falls back to git worktree add only when no native tool is available — using-git-worktrees Step 1a before Step 1b — and creates it under .worktrees/, verified by that skill's own Safety Verification substep"
        upstream-path: "skills/using-git-worktrees/SKILL.md"
        must-match: "#### Safety Verification (project-local directories only)"
      - file: "plugin/bin/lib/hooks/worktree-reap.js"
        claims: "scopes reaping to .claude/worktrees/ because finishing-a-development-branch cleans up only .worktrees/ or worktrees/ — a permanently separate, superpowers-owned domain"
        upstream-path: "skills/finishing-a-development-branch/SKILL.md"
        must-match: "Clean up only worktrees under `.worktrees/` or `worktrees/`. Everything else belongs to the host."
      - file: "plugin/skills/build/worktree-setup.md"
        claims: "using-git-worktrees (v5.1.0+) asks for consent before creating a worktree (fixes upstream #991) — the prompt /build's auto mode pre-authorizes"
        upstream-path: "skills/using-git-worktrees/SKILL.md"
        must-match: "ask for consent before creating a worktree"
      - file: "plugin/skills/wrap-up/cleanup-procedures.md"
        claims: "finishing-a-development-branch's Option 1 (Merge Locally) runs a bare git merge with no --no-ff, so a fast-forward-eligible merge produces no merge commit"
        upstream-path: "skills/finishing-a-development-branch/SKILL.md"
        must-match: "git merge <feature-branch>"
      - file: "plugin/skills/init/bootstrap/step-02-create-directory-structure.md"
        claims: "/init creates docs/superpowers/specs/ because that's brainstorming's default design-doc write path"
        upstream-path: "skills/brainstorming/SKILL.md"
        must-match: "docs/superpowers/specs/YYYY-MM-DD-<topic>-design.md"
      - file: "plugin/skills/init/bootstrap/step-02-create-directory-structure.md"
        claims: "/init creates docs/superpowers/plans/ because that's writing-plans' default plan write path"
        upstream-path: "skills/writing-plans/SKILL.md"
        must-match: "docs/superpowers/plans/YYYY-MM-DD-<feature-name>.md"
    # fixtures: [] — frozen-artifact rationale: an installed plugin cache dir is
    # immutable post-install, so version movement is the only mechanical change
    # signal; there is no runtime surface to replay (the impeccable-plugin
    # precedent). Falsifier, accepted as out-of-scope risk: a same-version
    # re-publish replacing bytes under an existing cache dir would go unseen.
    fixtures: []

  # emilkowalski/skills — the manifest's first content-hash-pinned entry class
  # (`versioning: none`): the upstream repo has no tags and no releases, so
  # there is no version line to pin. The pin is the upstream default branch's
  # HEAD commit at implementation time plus one sha256 per consumed file,
  # compared against committed snapshots under
  # tools/upstream-drift/fixtures/emilkowalski-skills/ (MIT-licensed).
  # Nothing is installed by this repo (Emil's skills are live-loaded per
  # plugin/skills/_shared/design-craft.md), so this entry deliberately declares no
  # installed-probe — checks.js's checkContentPins() is its code path, not the
  # probe machinery.
  # Scope: only each consumed skill's SKILL.md is pinned; a future dispatch
  # site consuming any other file from a skill directory must extend this
  # entry's `consumed` list (and commit the matching fixture).
  # The consumed list mirrors plugin/skills/_shared/design-craft.md's wired set.
  - name: emilkowalski-skills
    kind: skill-repo
    pin: { commit: "78761e1b57f97dce65b983d640c70a68f39e8163", versioning: none }
    upstream:
      repo: "emilkowalski/skills"
    consumed:
      - path: "skills/emil-design-eng/SKILL.md"
        sha256: "e71de849347050c2c573c1cf24d742d5a13459557ecffa6e562f08006f46b5b7"
      - path: "skills/animate/SKILL.md"
        sha256: "2a99870e61971553c0af3185a194c0e557f33aaa81e0422ca2fcec52195a4341"
      - path: "skills/animation-vocabulary/SKILL.md"
        sha256: "d718b48fe3c7898804d588f050a2e266d82c9f5ef51da256c8cb8b5951527757"
      - path: "skills/apple-design/SKILL.md"
        sha256: "11840b24a11d7f94f39c6aaab074750ae4e4de4ef54ee4b1dd97e16ebd485e61"
