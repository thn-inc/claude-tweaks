# tools/upstream-drift/manifest.yml
#
# What this repo claims about each upstream dependency, and how to test those
# claims against the artifact actually installed. Maintainer-only tooling: this
# directory is never shipped payload (it lives outside plugin/), and nothing
# under plugin/bin/ may import from it.
#
# The Impeccable plugin and the Impeccable CLI are TWO INDEPENDENT ENTRIES.
# Conflating them is the documented root cause of the drift that motivated this
# tool: a pin was maintained for one version line while the other was the thing
# actually installed, and no check ever compared either against reality.
#
# Every `installed-probe` resolves a version FROM THE ARTIFACT ITSELF, never
# from install metadata, a catalog, or gitCommitSha ([IL-89]).

dependencies:
  - name: impeccable-cli
    kind: npm-cli
    installed-probe:
      type: command
      run: "npx --no-install impeccable --version"
      root: "npm root -g"
      root-suffix: "impeccable"
    pinned: "4.1.0"
    # This is a shared dev host: other sessions running bare `npx impeccable`
    # (no --no-install, no version pin) periodically refresh npm's local npx
    # cache to whatever is then "latest" on the registry, and `npx --no-install`
    # here resolves against that cache non-deterministically — this drifted
    # exact-pin twice (#1900, then #2277) with no behavioral change between
    # 3.6.0 and 4.1.0 either time. `floor` accepts any installed version >= the
    # pin instead of requiring an exact match; a real behavioral break is still
    # caught by this dependency's own fixtures below, which run regardless.
    version-mode: floor
    upstream:
      repo: "pbakaus/impeccable"
      tag-prefix: "cli-v"
    # Between cli-v3.6.0 and cli-v4.0.0 the engine was rewritten from JS to
    # Rust (`crates/` in the upstream repo) and is now distributed as a
    # compiled, per-platform binary the npm shim downloads/execs — the npm
    # package itself ships only `cli/bin/` + LICENSE (its own `files` field).
    # `cli/engine/cli/main.mjs` and `cli/engine/registry/antipatterns.mjs`
    # (#2314) no longer exist anywhere under the installed root, so the only
    # file left that this contract can meaningfully name — one the installed
    # package actually ships, with a real counterpart in the upstream tree —
    # is the shim itself.
    contract-paths:
      - "cli/bin/cli.js"
    # The two claims below ("findings JSON on stdout, not stderr"; "a clean
    # scan prints [] on stdout") are still true at 4.1.0 — traced live against
    # crates/detect/src/cli.rs at cli-v4.1.0 (`ctx.io.out(&format!("{text}\n"))`
    # under `if json_mode`; `ctx.io.out("[]\n")` for a clean scan) — but that
    # Rust source is never installed locally; the shipped artifact is a
    # compiled binary with no local text left to grep. `checkAssertions` only
    # ever reads files under the installed root, so no upstream-path will ever
    # resolve for this engine again — these assertions are retired, not
    # relocated (#2314). Both claims stay independently verified end-to-end by
    # the fixtures immediately below (a real `detect` run against a real
    # binary is stronger evidence than a static grep ever was) and by
    # tests/impeccable-cli-contract.test.js's own live `detect` calls.
    assertions: []
    fixtures:
      - run: "npx --no-install impeccable detect --json --no-config --no-design-system tests/fixtures/impeccable-cli/warning.html"
        expect:
          exit: 2
          stream: stdout
          keys: [antipattern, name, description, severity, category, file, line, snippet]
      - run: "npx --no-install impeccable detect --json --no-config --no-design-system tests/fixtures/impeccable-cli/clean.html"
        expect:
          exit: 0
          stream: stdout
          keys: []

  - name: impeccable-plugin
    kind: claude-plugin
    installed-probe:
      type: plugin-cache-glob
      glob: "~/.claude/plugins/cache/*/impeccable/*/.claude-plugin/plugin.json"
    pinned: "4.5.0"
    # Second pin, read only by the drift tool and the tests, never by runtime
    # gating: the engine module's resolve() accepts any install carrying the
    # 4.2.2+ launcher and a cached engine binary, regardless of exact
    # version — see impeccable-plugin.md's "Last verified version, not an
    # exact pin". This records the engine VERSION of the SAME install
    # `pinned` above was recorded from (read via resolve()'s engine-probe
    # handshake), so the two numbers never drift to describe two different
    # installs. Not consumed by checkVersion/checkAssertions — the engine
    # module has no probe surface this tool's generic machinery can drive;
    # the pin-parity test in tests/impeccable-plugin-contract.test.js is this
    # value's only reader.
    pinned-engine: "0.1.11"
    upstream:
      repo: "pbakaus/impeccable"
      tag-prefix: "skill-v"
    contract-paths:
      - "skills/impeccable/SKILL.md"
      - "skills/impeccable/scripts/impeccable"
      - "skills/impeccable/reference/new-work.md"
      - "skills/impeccable/reference/doctor.md"
      - "agents/impeccable-finish-reviewer.md"
      - "skills/impeccable/reference/document.md"
      - "skills/impeccable/reference/craft-floor.md"
      - "skills/impeccable/reference/operate.md"
      - "skills/impeccable/reference/adapt.md"
      - "skills/impeccable/reference/clarify.md"
    assertions:
      - file: "plugin/skills/design-wrapper/command-map.md"
        claims: "the plugin exposes a polish command"
        upstream-path: "skills/impeccable/SKILL.md"
        must-match: "polish [target]"
      - file: "plugin/skills/design-wrapper/modes/shape.md"
        claims: "the plugin exposes a shape command taking a topic"
        upstream-path: "skills/impeccable/SKILL.md"
        must-match: "shape [feature]"
      - file: "plugin/skills/design-wrapper/impeccable-plugin.md"
        claims: "an install older than 4.2.2 is missing the launcher script at skills/impeccable/scripts/impeccable[.cmd]"
        upstream-path: "skills/impeccable/scripts/impeccable"
        must-match: "#!/bin/sh"
      - file: "plugin/skills/design-wrapper/impeccable-plugin.md"
        claims: "the launcher's own engine-probe/verb dispatch is the real compatibility boundary, not an exact plugin version"
        upstream-path: "skills/impeccable/scripts/impeccable"
        must-match: "engine-probe"
      - file: "plugin/bin/lib/impeccable-engine/index.js"
        claims: "every launcher call (the probe and each verb) carries IMPECCABLE_LAUNCHER_PROBE=1, so a probe reached recursively never triggers a download"
        upstream-path: "skills/impeccable/scripts/impeccable"
        must-match: "Inside another launcher's probe: no download, fail fast and quiet."
      - file: "plugin/skills/design-wrapper/modes/doctor.md"
        claims: "the engine's doctor verb is invoked with --json only"
        upstream-path: "skills/impeccable/reference/doctor.md"
        must-match: "doctor --json"
      # The direction contract. _shared/design-contract.md hard-codes the five block
      # labels and nothing else about upstream's contract, so a rename upstream must
      # surface as drift here — otherwise the parse quietly stops matching and /demo
      # renders an empty brief, which is indistinguishable from a record that simply
      # never had a contract.
      - file: "plugin/skills/_shared/design-contract.md"
        claims: "the direction contract lives under a ## Direction contract heading in the relevant surface brief, not in a repo file at a fixed path"
        upstream-path: "skills/impeccable/reference/new-work.md"
        must-match: "## Direction contract"
      - file: "plugin/skills/_shared/design-contract.md"
        claims: "the contract's five block labels are exactly THESIS, OWN-WORLD, STORY, FIRST VIEWPORT, FORM"
        upstream-path: "agents/impeccable-finish-reviewer.md"
        must-match: "(THESIS, OWN-WORLD, STORY, FIRST VIEWPORT, FORM)"
      - file: "plugin/skills/_shared/design-contract.md"
        claims: "the FORM block carries the seed key, and only when the seed dealt stagings — so its absence is normal, not drift"
        upstream-path: "skills/impeccable/reference/new-work.md"
        must-match: "the seed key the script printed"
      - file: "plugin/skills/design-wrapper/modes/explore.md"
        claims: "the seed path reuses a completed workshop choice without re-asking"
        upstream-path: "skills/impeccable/reference/document.md"
        must-match: "use its chosen direction directly"
      - file: "plugin/skills/design-wrapper/modes/explore.md"
        claims: "reroll excludes already-shown directions"
        upstream-path: "skills/impeccable/reference/new-work.md"
        must-match: "Re-roll eliminates every direction already shown"
      - file: "plugin/skills/design-wrapper/modes/explore.md"
        claims: "the direction-scope invocation exists"
        upstream-path: "skills/impeccable/reference/new-work.md"
        must-match: "--scope direction"
      - file: "plugin/skills/design-wrapper/modes/explore.md"
        claims: "after two consecutive rerolls, upstream asks what quality is missing"
        upstream-path: "skills/impeccable/reference/new-work.md"
        must-match: "after two consecutive re-rolls, ask what quality is missing"
      - file: "plugin/skills/design-wrapper/modes/explore.md"
        claims: "the canon standing exit is the user's door, never the mode's — listed last, never recommended"
        upstream-path: "skills/impeccable/reference/new-work.md"
        must-match: "It is the user's door, never yours"
      - file: "plugin/skills/design-wrapper/modes/explore.md"
        claims: "the surface-scope invocation exists"
        upstream-path: "skills/impeccable/reference/new-work.md"
        must-match: "--scope surface"
      - file: "plugin/skills/design-wrapper/modes/review.md"
        claims: "the finish-reviewer's first return line is one of exactly four disposition words"
        upstream-path: "agents/impeccable-finish-reviewer.md"
        must-match: "These four words are the whole vocabulary; never invent another."
      - file: "plugin/skills/design-wrapper/modes/review.md"
        claims: "a disposition: fix/rebuild/ship reply carries exactly five named sections: persistence, fidelity, ceiling, material_fixes, keep"
        upstream-path: "agents/impeccable-finish-reviewer.md"
        must-match: "exactly five sections: `persistence`"
      - file: "plugin/skills/design-wrapper/modes/pre-build.md"
        claims: "craft-floor.md carries the quality floor, read immediately before any UI edit"
        upstream-path: "skills/impeccable/reference/craft-floor.md"
        must-match: "# Craft floor"
      - file: "plugin/skills/design-wrapper/modes/pre-build.md"
        claims: "operate.md carries deeper Operate/Read guidance for dashboard, settings, admin, and tools surfaces"
        upstream-path: "skills/impeccable/reference/operate.md"
        must-match: "# Operate mode depth"
      - file: "plugin/skills/design-wrapper/modes/pre-build.md"
        claims: "adapt.md is the 4.5 equivalent of the retired responsive-design.md — adapting a design to a different screen size, device, platform, or use case"
        upstream-path: "skills/impeccable/reference/adapt.md"
        must-match: "Adapt an existing design to a different context"
      - file: "plugin/skills/design-wrapper/modes/pre-build.md"
        claims: "clarify.md is the 4.5 equivalent of the retired ux-writing.md — rewriting unclear interface text"
        upstream-path: "skills/impeccable/reference/clarify.md"
        must-match: "Rewrite unclear interface text so users understand what happened"
    fixtures: []

  # superpowers: the repo's heaviest dependency — eight consumed skills, and
  # /build's controller rides SDD's documented loop. Assertions pin the upstream
  # literals claude-tweaks acts on; the full pin/inert classification of every
  # citing file (the sweep ledger) is a comment on #262.
  # Rejected assertion candidate: specify/decomposition-mode.md's 3-8
  # tasks-per-work-unit sizing — no upstream literal encodes a task count
  # (writing-plans' granularity vocabulary is per-step: "bite-sized",
  # "2-5 minutes"); the sizing is local convention, its skill references bare
  # invocations — but the file itself is pinned separately, via assertion 13
  # (its own, unrelated git rm/add commands).
  - name: superpowers
    kind: claude-plugin
    installed-probe:
      type: plugin-cache-glob
      glob: "~/.claude/plugins/cache/*/superpowers/*/.claude-plugin/plugin.json"
    # Re-pinned 6.2.0 -> 7.0.0 (#3376), read from the installed 7.0.0 plugin.json.
    pinned: "7.0.0"
    upstream:
      repo: "obra/superpowers"
      tag-prefix: "v"
    contract-paths:
      - "skills/subagent-driven-development/SKILL.md"
      - "skills/subagent-driven-development/implementer-prompt.md"
      - "skills/brainstorming/SKILL.md"
      - "skills/using-git-worktrees/SKILL.md"
      - "skills/finishing-a-development-branch/SKILL.md"
      - "skills/writing-plans/SKILL.md"
