  # there is no version line to pin. The pin is the upstream default branch's
  # HEAD commit at implementation time plus one sha256 per consumed file,
  # compared against committed snapshots under
  # tools/upstream-drift/fixtures/emilkowalski-skills/ (MIT-licensed).
  # Nothing is installed by this repo (Emil's skills are live-loaded per
  # plugin/skills/_shared/design-craft.md), so this entry deliberately declares no
  # installed-probe — checks.js's checkContentPins() is its code path, not the
  # probe machinery.
  # Scope: only each consumed skill's SKILL.md is pinned; a future dispatch
  # site consuming any other file from a skill directory must extend this
  # entry's `consumed` list (and commit the matching fixture).
  # The consumed list mirrors plugin/skills/_shared/design-craft.md's wired set.
  - name: emilkowalski-skills
    kind: skill-repo
    pin: { commit: "78761e1b57f97dce65b983d640c70a68f39e8163", versioning: none }
    upstream:
      repo: "emilkowalski/skills"
    consumed:
      - path: "skills/emil-design-eng/SKILL.md"
        sha256: "e71de849347050c2c573c1cf24d742d5a13459557ecffa6e562f08006f46b5b7"
      - path: "skills/animate/SKILL.md"
        sha256: "2a99870e61971553c0af3185a194c0e557f33aaa81e0422ca2fcec52195a4341"
      - path: "skills/animation-vocabulary/SKILL.md"
        sha256: "d718b48fe3c7898804d588f050a2e266d82c9f5ef51da256c8cb8b5951527757"
      - path: "skills/apple-design/SKILL.md"
        sha256: "11840b24a11d7f94f39c6aaab074750ae4e4de4ef54ee4b1dd97e16ebd485e61"

  # claude-code: the harness itself. post-tool-use-failure.js and
  # bash-prefilter.js recognize Claude Code's worktree-isolation Bash refusal by
  # its text, so a reworded refusal would silently zero the `wd-guard-refusal`
  # events friction-events.js counts (#3304). Five assertions, two kinds:
  # - The first three are the fragments plugin/bin/lib/hooks/harness-refusal.js
  #   matches on; keep each `must-match` in lockstep with it —
  #   tests/harness-refusal-drift-pin.test.js enforces that. They are not unique
  #   to the matched templates: at 2.1.302 `noun:"This session"` occurs 1x,
  #   ` is isolated in the worktree ` 9x and `Refusing to run it` 5x, the rest in
  #   unrelated messages. So rewording only the templates the hook matches would
  #   leave all three passing.
  # - The last two anchor on text unique to those templates: `Refusing to run it`
  #   + a dash occurs 1x (the git-operations refusal, the "too complex to verify"
  #   family the hook logs), `Refusing to run it there` 2x (the two cwd-escape
  #   refusals). The dash is the minified source's six-character backslash-u2014
  #   escape, which is how the binary holds it; a toolchain change that emits a
  #   raw em dash instead shows up as loud false drift, never a silent miss.
  # Limit: literal substring matching cannot prove how a message is assembled, so
  # a change that keeps every asserted literal somewhere in the binary still
  # passes.
  # The artifact is a single compiled binary (268 MB at 2.1.302) whose embedded
  # JS keeps its template literals verbatim. That is why `root` resolves the
  # binary file itself (no `root-suffix`) and every `upstream-path` is "." —
  # path.join(file, ".") reads that file, matched as bytes, never decoded.
  # `version-mode: floor`: Claude Code auto-updates near daily, so an exact pin
  # would breach constantly; the assertions, not the version, carry the signal.
  # `fixtures: []`: a headless probe that provokes a real refusal costs API
  # tokens and depends on model behavior, while the template literal is
  # deterministic and offline.
  # `contract-paths: []`: claude-code is drift-only. A compiled binary has no
  # upstream source subtree to diff, so the capability half does not apply.
  - name: claude-code
    kind: native-cli
    installed-probe:
      type: command
      run: "claude --version | cut -d ' ' -f 1"
      root: 'readlink -f "$(command -v claude)"'
    pinned: "2.1.302"
