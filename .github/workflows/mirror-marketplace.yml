name: mirror-marketplace

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the release into the marketplace catalog
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          RESOLVED_SHA: ${{ github.sha }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::MARKETPLACE_TOKEN secret is missing or empty — cannot write to thn-inc/claude-tweaks-marketplace. See docs/releasing.md's Manual Steps." >&2
            exit 1
          fi
          CURRENT=$(gh api repos/thn-inc/claude-tweaks-marketplace/contents/.claude-plugin/marketplace.json)
          BLOB_SHA=$(echo "$CURRENT" | jq -r '.sha')
          CONTENT=$(echo "$CURRENT" | jq -r '.content' | base64 -d)
          # jq's `|=` on a no-match selection is a silent no-op that exits 0, so without
          # this guard a renamed or removed catalog entry would PUT the catalog back
          # unchanged and report success — mirroring would stop forever with no error
          # anywhere. The deleted plugin/bin/lib/release/mirror.js threw on exactly this.
          if [ "$(echo "$CONTENT" | jq '[.plugins[]? | select(.name == "claude-tweaks")] | length')" -ne 1 ]; then
            echo "::error::marketplace.json has no single \"claude-tweaks\" entry under .plugins[] — refusing to PUT an unchanged catalog. Check whether the entry was renamed or removed." >&2
            exit 1
          fi
          NEW_CONTENT=$(echo "$CONTENT" | jq --arg sha "$RESOLVED_SHA" '
            (.plugins[] | select(.name == "claude-tweaks")) |= (
              del(.version) | .source = {source: "git-subdir", url: "https://github.com/thn-inc/claude-tweaks", path: "plugin", sha: $sha}
            )
          ')
          ENCODED=$(echo "$NEW_CONTENT" | base64 -w0)
          gh api -X PUT repos/thn-inc/claude-tweaks-marketplace/contents/.claude-plugin/marketplace.json \
            -f "message=Mirror claude-tweaks ${TAG}" \
            -f "content=${ENCODED}" \
            -f "sha=${BLOB_SHA}" \
            -f "branch=main"
      # pr-first post-publish step (#2582): release-please has no knowledge of
      # this repo's own `Release-Note:` trailer, so it never renders a
      # Highlights block — this step walks the just-published commit range,
      # extracts those trailers, and appends the rendered block to both the
      # just-published GitHub Release body and the matching CHANGELOG.md
      # entry, after the event that fires this workflow has already landed.
      - name: Checkout for release notes publish
        uses: actions/checkout@v4
        with:
          # Full history: the step walks `git log --first-parent
          # {previous-tag}..{new-tag}`, and pushes the follow-up CHANGELOG
          # commit straight back onto the default branch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node plugin/bin/release-notes-publish.js
