# Post-merge Windows regression guard (#3316).
#
# Runs on pushes to main only, never on PRs: the pr-first merge gate waits on
# every check in a PR's rollup, so a slow Windows job there would delay every
# merge. HEAD^1 is the right comparison base because merges to main are squashed
# (linear history), so the previous commit is exactly the state before this one.
#
# verify.js runs the suite on this commit and, for each failing test file, on
# HEAD^1 — only failures that are new on this commit count. The filer step reads
# its report and files one type:bug issue on main; the filer's exit code is the
# job's result (0 = clean, 1 = new failures or an unreadable report).
name: windows-regression

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: windows-regression-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Several suites build git fixtures that commit; CI runners have no git identity.
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@invalid.example
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@invalid.example
      # reconcile()'s GitHub-health preflight (plugin/bin/lib/reconcile/preflight.js,
      # #820) shells to `gh api rate_limit` before any dispatch that doesn't stub
      # it — an unauthenticated `gh` reads as "GitHub unreachable" and skips the
      # whole pass, which is exactly what happened here without a token.
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      # Before checkout: .claude-tweaks/pipelines/**/work/ paths are deep enough to
      # hit the Windows MAX_PATH limit.
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          # Full history: HEAD^1 must exist for the baseline run.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Line-ending diagnostics
        run: |
          git config core.autocrlf || true
          git ls-files --eol -- README.md
      - name: Verify against the previous commit
        id: verify
        continue-on-error: true
        run: >-
          node plugin/bin/verify.js
          --cmd tests="npm test"
          --baseline HEAD^1
          --baseline-cmd tests="node --test {file}"
          --json "$RUNNER_TEMP/verify-report.json"
          --log-dir "$RUNNER_TEMP/verify-logs"
          --no-stamp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: |
            ${{ runner.temp }}/verify-report.json
            ${{ runner.temp }}/verify-logs
          if-no-files-found: warn
      - name: File an issue for new failures
        if: always()
        run: >-
          node tools/windows-regression/file-issue.js
          --report "$RUNNER_TEMP/verify-report.json"
          --ref "$GITHUB_REF"
          --sha "$GITHUB_SHA"
          --repo "$GITHUB_REPOSITORY"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
