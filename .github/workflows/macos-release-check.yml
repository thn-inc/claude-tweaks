# macOS release check (#5881): the full suite on GitHub's standard macos-latest
# runner, dispatchable against any sha.
name: macos-release-check

on:
  pull_request:
    paths:
      - .github/workflows/macos-release-check.yml
  workflow_dispatch:
    inputs:
      sha:
        description: Commit sha to check
        required: true
        type: string

concurrency:
  group: macos-release-check-${{ github.event_name == 'pull_request' && github.ref || inputs.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  suite:
    name: full suite (macos-latest, node ${{ matrix.node }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 20 is the repo's CI Node; 22 is what the local macOS run uses.
        node: ${{ github.event_name == 'pull_request' && fromJSON('[20,22]') || fromJSON('[22]') }}
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@invalid.example
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@invalid.example
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Diagnostics (temporary)
        shell: bash
        run: |
          node -v
          command -v -a node
          echo "$PATH"
          env | grep -i -e node -e bash_env -e test_context || true
          sw_vers
          /bin/bash --version | head -1
          command -v bash
          ls -ld "$TMPDIR"
          mount | grep -e ' /private' -e ' /var' || true
          d=$(mktemp -d)
          printf '#!/bin/sh\necho STUB\n' > "$d/node"
          chmod 755 "$d/node"
          ls -l "$d/node"
          env -i PATH="$d:$PATH" HOME="$HOME" bash -c 'command -v node; node x'
          env -i PATH="$d:$PATH" HOME="$HOME" zsh -f -c 'command -v node; node x'
      - name: Run the whole suite
        shell: bash
        run: |
          set +e
          npm test --silent -- --full | tee "$RUNNER_TEMP/suite.tap"
          code=${PIPESTATUS[0]}
          exit $code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suite-tap-node-${{ matrix.node }}
          path: ${{ runner.temp }}/suite.tap
          retention-days: 7
          if-no-files-found: warn
