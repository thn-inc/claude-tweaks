name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Several suites build git fixtures that commit; CI runners have no git identity.
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@invalid.example
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@invalid.example
      # reconcile()'s GitHub-health preflight (plugin/bin/lib/reconcile/preflight.js,
      # #820) shells to `gh api rate_limit` before any dispatch that doesn't stub
      # it — an unauthenticated `gh` reads as "GitHub unreachable" and skips the
      # whole pass, which is exactly what happened here without a token.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: changelog-coverage and shipped-record tests walk
          # origin/main's history; a shallow clone makes those gates vacuous.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ubuntu-latest ships no zsh, and the zsh cases (the zsh-only word-split
      # defect in wrap-up-closing-records-array-fill.test.js, #4107) skip
      # when it is absent from PATH.
      - run: sudo apt-get update && sudo apt-get install -y zsh
      # No npm install step: the plugin ships zero npm deps, and node --test is built in.
      - run: npm test
