# TEMPORARY (#5756): records tools/test-durations.json on the CI runner, the hardware the shards run on.
# This PR branch adds the file and removes it again in the commit that adds the recorded map; it
# triggers only on a change to this file.
name: record-durations

on:
  pull_request:
    paths:
      - .github/workflows/record-durations.yml

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@invalid.example
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@invalid.example
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: sudo apt-get install -y --no-install-recommends zsh || (sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh)
      - name: Record per-file test durations
        shell: bash
        run: node tools/run-tests.js --record-durations "$RUNNER_TEMP/test-durations.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-durations
          path: ${{ runner.temp }}/test-durations.json
          retention-days: 7
          if-no-files-found: error
